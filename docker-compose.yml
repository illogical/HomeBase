services:
  homebase:
    build:
      context: .
    image: homebase:latest
    restart: unless-stopped
    stop_grace_period: 25s
    env_file:
      - .env.docker
    environment:
      HOMEBASE_WORKSPACE_PATH: /workspace
      HOMEBASE_DATA_PATH: /data
    ports:
      - "127.0.0.1:${HOMEBASE_PORT:-17106}:${HOMEBASE_PORT:-17106}"
    volumes:
      - ${HOMEBASE_HOST_WORKSPACE_PATH}:/workspace:ro
      - devplanner-node-modules:/workspace/DevPlanner/node_modules
      - lmapi-node-modules:/workspace/LMApi/node_modules
      - memoryapi-node-modules:/workspace/MemoryApi/node_modules
      - lmeval-node-modules:/workspace/LMEval/node_modules
      - ${HOMEBASE_HOST_DATA_PATH}:/data:rw
      - ${HOMEBASE_HOST_CONFIG_PATH}:/app/config/homebase.json:ro
      - ${HOMEBASE_HOST_DEVPLANNER_WORKSPACE_PATH}:/mnt/devplanner-workspace:rw
      - ${HOMEBASE_HOST_DEVPLANNER_VAULT_PATH}:/mnt/devplanner-vault:rw

volumes:
  devplanner-node-modules:
  lmapi-node-modules:
  memoryapi-node-modules:
  lmeval-node-modules:
